[pytest]
# `pytest` with no path collects exactly what CI runs (nhid-gates.yml: `pytest tests/`).
# Without this, a bare `pytest` from the root also collected webplatform/tests, whose
# import needs jinja2, and one collection error makes pytest run nothing at all.
testpaths = tests
python_files = test_*.py *_harness.py
asyncio_mode = strict
addopts = --ignore=tests/demo
