AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NHID Clinical Policy Engine - Hosted Conformance API

Parameters:
  # ── Website demo feature secrets (NOT the governance framework) ─────────
  # Forwarded via `make deploy CLOUDFLARE_TURNSTILE_SECRET=...` — see Makefile.
  CloudflareTurnstileSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Cloudflare Turnstile secret key, used to verify CAPTCHA tokens on public demo forms.
  ElevenLabsApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: ElevenLabs API key for the Beacon outbound call demo.
  ElevenLabsPhoneNumberId:
    Type: String
    NoEcho: true
    Default: ""
    Description: ElevenLabs provisioned phone number ID for Beacon outbound calls.
  TwilioAccountSid:
    Type: String
    NoEcho: true
    Default: ""
    Description: Twilio Account SID, used to send the starter-pack SMS from the inbound demo line.
  TwilioAuthToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Twilio Auth Token, paired with the Account SID for SMS sends.
  TwilioSmsFrom:
    Type: String
    Default: ""
    Description: SMS-capable Twilio number (or Messaging Service SID) the starter-pack texts are sent from.
  StarterPackUrl:
    Type: String
    Default: "https://nhid-clinical.org/shadow-evaluation-guide.html"
    Description: URL texted to callers who opt in to the starter-pack SMS at the end of the demo.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.13

Resources:

  # ── Lambda function ──────────────────────────────────────────────────────
  ConformanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: nhid-conformance-check
      Handler: functions.handler.lambda_handler
      # CodeUri: . packages the full repo root so src/ is importable
      CodeUri: .
      Description: NHID Clinical policy engine conformance checker
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref DemoCallStatusTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
      Environment:
        Variables:
          DEMO_CALL_STATUS_TABLE: !Ref DemoCallStatusTable
          RATE_LIMIT_TABLE: !Ref RateLimitTable
          CLOUDFLARE_TURNSTILE_SECRET: !Ref CloudflareTurnstileSecret
          ELEVENLABS_API_KEY: !Ref ElevenLabsApiKey
          ELEVENLABS_PHONE_NUMBER_ID: !Ref ElevenLabsPhoneNumberId
          TWILIO_ACCOUNT_SID: !Ref TwilioAccountSid
          TWILIO_AUTH_TOKEN: !Ref TwilioAuthToken
          TWILIO_SMS_FROM: !Ref TwilioSmsFrom
          STARTER_PACK_URL: !Ref StarterPackUrl
      Events:
        ConformancePost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/conformance/check
            Method: POST
            Auth:
              ApiKeyRequired: true
        DemoPost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/demo/check
            Method: POST
        VapiAdapterPost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/adapters/vapi/check
            Method: POST
        TwilioAdapterPost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/adapters/twilio/check
            Method: POST
        VonageAdapterPost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/adapters/vonage/check
            Method: POST
        RetellAdapterPost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/adapters/retell/check
            Method: POST
        ConnectAdapterPost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/adapters/connect/check
            Method: POST
        CallProgressPost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/webhooks/call-progress
            Method: POST
        BadgeGet:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/public/vendor/{vendor_id}/badge
            Method: GET
        MetricsSummaryGet:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/vendor/metrics/summary
            Method: GET
            Auth:
              ApiKeyRequired: true
        PilotEnrollPost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/pilot/enroll
            Method: POST
        CTSEvaluatePost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/cts/evaluate
            Method: POST
        HealthGet:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /health
            Method: GET
        TwilioDemoVoicePost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/webhooks/twilio-demo/voice
            Method: POST
        DemoCallStatusGet:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/demo/call-status
            Method: GET
        DemoCallPost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/demo/call
            Method: POST
        DemoSmsOptInPost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/demo/sms-opt-in
            Method: POST
        ElevenLabsPostCallWebhookPost:
          Type: Api
          Properties:
            RestApiId: !Ref NHIDApi
            Path: /v1/webhooks/elevenlabs/postcall
            Method: POST

  # ── Website demo feature: live status store (NOT the governance framework) ─
  # Backs the Twilio scripted inbound demo line and (later) the Beacon
  # outbound demo. TTL self-cleans sessions ~1hr after their last write.
  DemoCallStatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nhid-demo-call-status
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Website demo feature: rate-limit counters (NOT the governance framework) ─
  # Backs functions/rate_limiter.py — abuse deterrence for public demo forms
  # (e.g. the Beacon outbound-call demo). TTL self-cleans windows.
  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: nhid-demo-rate-limit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: rl_key
          AttributeType: S
      KeySchema:
        - AttributeName: rl_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── API Gateway REST API ─────────────────────────────────────────────────
  NHIDApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Description: NHID Clinical Policy Engine API
      Cors:
        AllowMethods: "'POST,GET,OPTIONS'"
        AllowHeaders: "'Content-Type,x-api-key'"
        AllowOrigin: "'*'"

  # ── Usage plan: 50k req/month, 20 req/s sustained, 100 burst ────────────
  NHIDUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    # SAM names the stage resource as <ApiLogicalId><StageName>Stage
    DependsOn: NHIDApiprodStage
    Properties:
      UsagePlanName: nhid-clinical-plan
      Description: NHID Clinical API monthly quota
      ApiStages:
        - ApiId: !Ref NHIDApi
          Stage: prod
      Quota:
        Limit: 50000
        Period: MONTH
      Throttle:
        BurstLimit: 100
        RateLimit: 20

  # ── Default API key (retrieve value with `make get-key`) ─────────────────
  NHIDDefaultApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: NHIDApiprodStage
    Properties:
      Name: nhid-clinical-default-key
      Description: Default API key for NHID Clinical
      Enabled: true
      StageKeys:
        - RestApiId: !Ref NHIDApi
          StageName: prod

  NHIDApiKeyToUsagePlan:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref NHIDDefaultApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref NHIDUsagePlan

  # ── CloudWatch log group (30-day retention) ──────────────────────────────
  ConformanceFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ConformanceFunction}"
      RetentionInDays: 30

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${NHIDApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  ConformanceEndpoint:
    Description: "POST here with x-api-key header to check conformance"
    Value: !Sub "https://${NHIDApi}.execute-api.${AWS::Region}.amazonaws.com/prod/v1/conformance/check"

  HealthEndpoint:
    Description: "GET health check (no auth)"
    Value: !Sub "https://${NHIDApi}.execute-api.${AWS::Region}.amazonaws.com/prod/health"

  ApiKeyId:
    Description: "Run `make get-key` to print the actual key value"
    Value: !Ref NHIDDefaultApiKey
