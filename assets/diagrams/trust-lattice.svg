<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img"
     aria-labelledby="ctl-lattice-title ctl-lattice-desc" class="ctl-lattice">
  <title id="ctl-lattice-title">The Trust Lattice: five conceptual trust layers</title>
  <desc id="ctl-lattice-desc">A conceptual diagram of five stacked transparent planes, labelled from
    top to bottom: Disclose, Authorize, Scope, Audit, Observe. A single token descends through the
    stack, representing a request passing each layer in order before data moves. This is an
    explanatory metaphor for the order in which trust is established. It is not a system
    architecture diagram and does not describe a deployed integration.</desc>

  <defs>
    <linearGradient id="ctl-plane-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#55d9cb" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1e63db" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="ctl-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#75ece0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#75ece0" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Vertical trust path -->
  <line x1="260" y1="40" x2="260" y2="372" stroke="url(#ctl-beam)" stroke-width="2"/>

  <!-- Five planes, top (Disclose) to bottom (Observe). Isometric parallelograms. -->
  <g stroke="#55d9cb" stroke-width="1.25" fill="url(#ctl-plane-a)">
    <polygon points="260,52  418,110 260,168 102,110"/>
    <polygon points="260,116 418,174 260,232 102,174"/>
    <polygon points="260,180 418,238 260,296 102,238"/>
    <polygon points="260,244 418,302 260,360 102,302"/>
    <polygon points="260,308 418,366 260,424 102,366"/>
  </g>

  <!-- Layer labels: real text, never baked into a raster -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700"
     fill="#dff3ff" letter-spacing="0.08em">
    <text x="24" y="115">DISCLOSE</text>
    <text x="24" y="179">AUTHORIZE</text>
    <text x="24" y="243">SCOPE</text>
    <text x="24" y="307">AUDIT</text>
    <text x="24" y="371">OBSERVE</text>
  </g>

  <!-- Leader lines from label to plane edge -->
  <g stroke="#3f7fa8" stroke-width="1" stroke-dasharray="2 3">
    <line x1="96" y1="111" x2="102" y2="111"/>
    <line x1="96" y1="175" x2="102" y2="175"/>
    <line x1="96" y1="239" x2="102" y2="239"/>
    <line x1="96" y1="303" x2="102" y2="303"/>
    <line x1="96" y1="367" x2="102" y2="367"/>
  </g>

  <!-- Descending token -->
  <g class="ctl-lattice-token">
    <rect x="249" y="44" width="22" height="22" rx="4"
          fill="#75ece0" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.65"/>
  </g>
</svg>
