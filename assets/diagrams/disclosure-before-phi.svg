<?xml version="1.0" encoding="UTF-8"?>
<!-- Exported from the Sequence of interaction figure on specification.html; the
     same drawing with the site's token values inlined so GitHub can render it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" width="880" height="600" role="img" aria-labelledby="sq-title sq-desc">
          <title id="sq-title">The disclosure gate in a standard eligibility workflow</title>
          <desc id="sq-desc">A sequence across four lanes: the AI voice agent calling on behalf of a provider, the payer representative receiving the call, the NHID-Clinical policy engine, and the operational workflow. Step 1: the agent opens the call by stating that it is an automated system. Step 2: the representative acknowledges and asks for the NPI. Step 3: the turn is submitted to the engine as evaluate_all(session, event). Step 4: the engine returns CONTINUE_AI with the reason code IDG01_DISCLOSURE_CONFIRMED. Only after that decision does the interaction cross the disclosure gate into the operational workflow, where in step 5 the NPI is supplied and the exchange proceeds. Below the gate, two branches are drawn dashed to show what happens instead when the gate does not clear: a request for protected data before disclosure returns DENY_DATA with PDX01_PHI_GATE_TRIGGERED, and a disclosure the representative interrupted before it was heard returns DISCLOSE_IDENTITY with IDG01_DISCLOSURE_INTERRUPTED; in both the gate stays closed. A dashed ATR-01 band along the bottom spans every lane: every turn above, before and after the gate, is written to the audit trail, and ATR-01 changes no behavior. Labeled Reference, a conceptual model, not a recording of a call.</desc>
  <style>
    .sq-bg { fill: #fdfcfa; }
    .sq-lane rect { fill: #eaf3f1; stroke: #9cc5cf; stroke-width: 1.5; }
    .sq-lane-name { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12.5px; font-weight: 650; fill: #0d2846; }
    .sq-lane-role { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 10.5px; fill: #3a424b; }
    .sq-life { stroke: rgba(28, 32, 38, 0.14); stroke-width: 1.5; stroke-dasharray: 3 5; }
    .sq-msg { stroke: #14778f; stroke-width: 1.8; }
    .sq-msg-head { fill: #14778f; }
    .sq-return { stroke: #0b6ebc; stroke-width: 1.8; stroke-dasharray: 6 4; }
    .sq-return-head { fill: #0b6ebc; }
    .sq-step { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 10px; font-weight: 500; fill: #3a424b; }
    .sq-label { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 11.5px; fill: #1f2730; }
    .sq-call { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 11px; fill: #0d2846; }
    .sq-gate line { stroke: #0b6ebc; stroke-width: 1.5; stroke-dasharray: 6 4; opacity: 0.9; }
    .sq-gate-label { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 9.5px; letter-spacing: 0.1em; fill: #0b6ebc; }
    .sq-out rect { fill: #eef2f6; stroke: #0b6ebc; stroke-width: 1.2; }
    .sq-out.is-deny rect { fill: #f6f4f0; stroke: #0d2846; }
    .sq-out-key { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 10px; fill: #3a424b; }
    .sq-out-val { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 10px; font-weight: 500; fill: #0d2846; }
    .sq-alt { stroke: #3a424b; stroke-width: 1.6; stroke-dasharray: 4 4; }
    .sq-alt-head { fill: #3a424b; }
    .sq-alt-label { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 9.5px; letter-spacing: 0.1em; fill: #3a424b; }
    .sq-audit rect { fill: none; stroke: #14778f; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .sq-audit-label { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 10px; letter-spacing: 0.08em; fill: #14778f; }
    .sq-audit-note { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 10.5px; fill: #3a424b; }
  </style>
  <rect class="sq-bg" x="0" y="0" width="880" height="600" rx="12"/>


          <!-- Lanes -->
          <g class="sq-lane">
            <rect x="8" y="14" width="196" height="46" rx="8"/>
            <rect x="228" y="14" width="196" height="46" rx="8"/>
            <rect x="448" y="14" width="196" height="46" rx="8"/>
            <rect x="668" y="14" width="204" height="46" rx="8"/>
          </g>
          <text x="106" y="35" text-anchor="middle" class="sq-lane-name">AI voice agent</text>
          <text x="106" y="50" text-anchor="middle" class="sq-lane-role">Calling on behalf of a provider</text>
          <text x="326" y="35" text-anchor="middle" class="sq-lane-name">Payer representative</text>
          <text x="326" y="50" text-anchor="middle" class="sq-lane-role">Human, receiving organization</text>
          <text x="546" y="35" text-anchor="middle" class="sq-lane-name">NHID-Clinical policy engine</text>
          <text x="546" y="50" text-anchor="middle" class="sq-lane-role">evaluate_all, deterministic</text>
          <text x="770" y="35" text-anchor="middle" class="sq-lane-name">Operational workflow</text>
          <text x="770" y="50" text-anchor="middle" class="sq-lane-role">Eligibility, claims, prior auth</text>

          <!-- Lifelines -->
          <line x1="106" y1="60" x2="106" y2="520" class="sq-life"/>
          <line x1="326" y1="60" x2="326" y2="520" class="sq-life"/>
          <line x1="546" y1="60" x2="546" y2="520" class="sq-life"/>
          <line x1="770" y1="60" x2="770" y2="520" class="sq-life"/>

          <!-- 1. Disclosure -->
          <text x="16" y="86" class="sq-step">1</text>
          <line x1="106" y1="98" x2="318" y2="98" class="sq-msg"/>
          <polygon points="326,98 314,93 314,103" class="sq-msg-head"/>
          <text x="216" y="92" text-anchor="middle" class="sq-label">&#8220;I am an automated system calling from&#8230;&#8221;</text>

          <!-- 2. Acknowledgement -->
          <text x="16" y="134" class="sq-step">2</text>
          <line x1="326" y1="146" x2="114" y2="146" class="sq-msg"/>
          <polygon points="106,146 118,141 118,151" class="sq-msg-head"/>
          <text x="216" y="140" text-anchor="middle" class="sq-label">&#8220;Understood. Please provide the NPI.&#8221;</text>

          <!-- 3. Evaluation -->
          <text x="16" y="182" class="sq-step">3</text>
          <line x1="106" y1="194" x2="538" y2="194" class="sq-msg"/>
          <polygon points="546,194 534,189 534,199" class="sq-msg-head"/>
          <text x="326" y="188" text-anchor="middle" class="sq-call">evaluate_all(session, event)</text>

          <!-- 4. Decision returned -->
          <text x="16" y="230" class="sq-step">4</text>
          <line x1="546" y1="242" x2="114" y2="242" class="sq-return"/>
          <polygon points="106,242 118,237 118,247" class="sq-return-head"/>
          <text x="326" y="236" text-anchor="middle" class="sq-call">PolicyDecision</text>

          <!-- Engine output, verbatim -->
          <g class="sq-out">
            <rect x="452" y="256" width="234" height="60" rx="6"/>
          </g>
          <text x="466" y="274" class="sq-out-key">action:</text>
          <text x="540" y="274" class="sq-out-val">CONTINUE_AI</text>
          <text x="466" y="290" class="sq-out-key">reason_code:</text>
          <text x="466" y="306" class="sq-out-val">IDG01_DISCLOSURE_CONFIRMED</text>

          <!-- The gate -->
          <g class="sq-gate">
            <line x1="8" y1="338" x2="872" y2="338"/>
          </g>
          <text x="8" y="332" class="sq-gate-label">DISCLOSURE GATE &#183; IDG-01 MUST CLEAR BEFORE OPERATIONAL EXCHANGE</text>

          <!-- 5. Operational exchange -->
          <text x="16" y="368" class="sq-step">5</text>
          <line x1="106" y1="380" x2="318" y2="380" class="sq-msg"/>
          <polygon points="326,380 314,375 314,385" class="sq-msg-head"/>
          <text x="216" y="374" text-anchor="middle" class="sq-label">&#8220;The NPI is 1234567890.&#8221;</text>
          <line x1="326" y1="380" x2="762" y2="380" class="sq-msg"/>
          <polygon points="770,380 758,375 758,385" class="sq-msg-head"/>
          <text x="548" y="374" text-anchor="middle" class="sq-label">Administrative exchange proceeds</text>

          <!-- If instead: two branches where the gate stays closed, drawn dashed -->
          <line x1="8" y1="412" x2="872" y2="412" class="sq-alt"/>
          <text x="8" y="406" class="sq-alt-label">IF INSTEAD &#183; THE GATE STAYS CLOSED</text>

          <text x="16" y="436" class="sq-step">A</text>
          <line x1="106" y1="448" x2="318" y2="448" class="sq-alt"/>
          <polygon points="326,448 314,443 314,453" class="sq-alt-head"/>
          <text x="216" y="442" text-anchor="middle" class="sq-label">&#8220;Can I get the member ID?&#8221; &#8212; before any disclosure</text>
          <g class="sq-out is-deny"><rect x="452" y="428" width="300" height="38" rx="6"/></g>
          <text x="466" y="444" class="sq-out-key">action:</text><text x="520" y="444" class="sq-out-val">DENY_DATA</text>
          <text x="466" y="459" class="sq-out-key">reason_code:</text><text x="548" y="459" class="sq-out-val">PDX01_PHI_GATE_TRIGGERED</text>

          <text x="16" y="486" class="sq-step">B</text>
          <line x1="106" y1="498" x2="206" y2="498" class="sq-alt"/>
          <line x1="326" y1="498" x2="226" y2="498" class="sq-alt"/>
          <polygon points="218,498 230,493 230,503" class="sq-alt-head"/>
          <text x="216" y="492" text-anchor="middle" class="sq-label">Disclosure interrupted before it was heard</text>
          <g class="sq-out is-deny"><rect x="452" y="478" width="300" height="38" rx="6"/></g>
          <text x="466" y="494" class="sq-out-key">action:</text><text x="520" y="494" class="sq-out-val">DISCLOSE_IDENTITY</text>
          <text x="466" y="509" class="sq-out-key">reason_code:</text><text x="548" y="509" class="sq-out-val">IDG01_DISCLOSURE_INTERRUPTED</text>

          <!-- ATR-01: the band every turn is written to -->
          <g class="sq-audit"><rect x="8" y="540" width="864" height="44" rx="8"/></g>
          <text x="24" y="558" class="sq-audit-label">ATR-01 &#183; AUDIT TRAIL REQUIREMENTS</text>
          <text x="24" y="574" class="sq-audit-note">Every turn above, before and after the gate, is written to the audit trail. Records what the other four decided. Changes no behavior.</text>
        </svg>
