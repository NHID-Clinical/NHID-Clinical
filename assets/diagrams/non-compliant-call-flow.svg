<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750">
  <defs>
    <linearGradient id="warningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="warningGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FEE2E2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FECACA;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="warningGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#991B1B;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7F1D1D;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="glassOverlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.08" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7F1D1D" flood-opacity="0.3"/>
    </filter>
    <filter id="shadowDark">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7F1D1D" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#EF4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="750" fill="#0B1220"/>

  <!-- Header Banner -->
  <rect x="0" y="0" width="800" height="60" fill="url(#warningGrad)" filter="url(#shadowDark)"/>
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">
    ❌ Non-Compliant Call Flow
  </text>

  <!-- Step 1: Call Initiated -->
  <g filter="url(#shadow)">
    <rect x="50" y="90" width="700" height="70" rx="8" fill="url(#warningGradLight)" stroke="#EF4444" stroke-width="2"/>
    <rect x="50" y="90" width="700" height="70" rx="8" fill="url(#glassOverlay)" opacity="0.4"/>
    <path d="M55 97 L745 97" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.25"/>
  </g>
  <text x="70" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7F1D1D">Step 1: Call Initiated</text>
  <text x="70" y="140" font-family="Arial, sans-serif" font-size="13" fill="#7F1D1D">AI agent calls payer without disclosure</text>

  <!-- Dashed Arrow 1 -->
  <line x1="400" y1="160" x2="400" y2="190" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>

  <!-- Step 2: Deceptive Greeting -->
  <g filter="url(#shadow)">
    <rect x="50" y="190" width="700" height="90" rx="8" fill="url(#warningGradLight)" stroke="#EF4444" stroke-width="2"/>
    <rect x="50" y="190" width="700" height="90" rx="8" fill="url(#glassOverlay)" opacity="0.45"/>
    <path d="M55 197 L745 197" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.28"/>
  </g>
  <text x="70" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7F1D1D">Step 2: Deceptive Greeting + Authentication</text>
  <text x="70" y="240" font-family="Arial, sans-serif" font-size="13" fill="#7F1D1D">"Hi, this is Sarah. I'm calling about a claim for patient [name]."</text>
  <text x="70" y="260" font-family="Arial, sans-serif" font-size="13" fill="#7F1D1D">Uses human name with no AI qualifier + fake typing/call center sounds</text>

  <!-- Dashed Arrow 2 -->
  <line x1="400" y1="280" x2="400" y2="310" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>

  <!-- Step 3: Rep Requests Authentication -->
  <g filter="url(#shadow)">
    <rect x="50" y="310" width="700" height="70" rx="8" fill="url(#warningGradLight)" stroke="#EF4444" stroke-width="2"/>
    <rect x="50" y="310" width="700" height="70" rx="8" fill="url(#glassOverlay)" opacity="0.4"/>
    <path d="M55 317 L745 317" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.25"/>
  </g>
  <text x="70" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7F1D1D">Step 3: Rep Follows Script</text>
  <text x="70" y="360" font-family="Arial, sans-serif" font-size="13" fill="#7F1D1D">"Can I have your NPI number and Member ID please?"</text>

  <!-- Dashed Arrow 3 -->
  <line x1="400" y1="380" x2="400" y2="410" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>

  <!-- Step 4: AI Provides Authentication -->
  <g filter="url(#shadow)">
    <rect x="50" y="410" width="700" height="70" rx="8" fill="url(#warningGradLight)" stroke="#EF4444" stroke-width="2"/>
    <rect x="50" y="410" width="700" height="70" rx="8" fill="url(#glassOverlay)" opacity="0.4"/>
    <path d="M55 417 L745 417" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.25"/>
  </g>
  <text x="70" y="435" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7F1D1D">Step 4: AI Provides Authentication Convincingly</text>
  <text x="70" y="460" font-family="Arial, sans-serif" font-size="13" fill="#7F1D1D">Gives NPI, Member ID, DOB with natural pauses and "umm" sounds</text>

  <!-- Dashed Arrow 4 -->
  <line x1="400" y1="480" x2="400" y2="510" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>

  <!-- Step 5: PHI Exposure Risk -->
  <g filter="url(#shadow)">
    <rect x="50" y="510" width="700" height="90" rx="8" fill="url(#warningGradLight)" stroke="#EF4444" stroke-width="3"/>
    <rect x="50" y="510" width="700" height="90" rx="8" fill="url(#glassOverlay)" opacity="0.5"/>
    <path d="M55 517 L745 517" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.3"/>
  </g>
  <text x="70" y="535" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7F1D1D">⚠️ Step 5: Rep Shares Protected Data (Unknowingly)</text>
  <text x="70" y="560" font-family="Arial, sans-serif" font-size="13" fill="#7F1D1D">Rep provides claim status, appeal updates, eligibility details</text>
  <text x="70" y="580" font-family="Arial, sans-serif" font-size="13" fill="#7F1D1D">thinking they're speaking with a legitimate provider office</text>

  <!-- Dashed Arrow 5 -->
  <line x1="400" y1="600" x2="400" y2="630" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>

  <!-- Step 6: Detection (Too Late) -->
  <g filter="url(#shadow)">
    <rect x="50" y="630" width="700" height="70" rx="8" fill="url(#warningGradLight)" stroke="#EF4444" stroke-width="2"/>
    <rect x="50" y="630" width="700" height="70" rx="8" fill="url(#glassOverlay)" opacity="0.4"/>
    <path d="M55 637 L745 637" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.25"/>
  </g>
  <text x="70" y="655" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#7F1D1D">Step 6: Detection (After 3–5 Minutes)</text>
  <text x="70" y="680" font-family="Arial, sans-serif" font-size="13" fill="#7F1D1D">Rep: "Are you a real person?" — AI finally discloses, but data already shared</text>

  <!-- Step 7: Call Termination -->
  <g filter="url(#shadowDark)">
    <rect x="50" y="700" width="700" height="50" rx="8" fill="url(#warningGradDark)" stroke="#EF4444" stroke-width="3"/>
    <rect x="50" y="700" width="700" height="50" rx="8" fill="url(#glassOverlay)" opacity="0.35"/>
    <path d="M55 706 L745 706" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.25"/>
  </g>
  <text x="400" y="732" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FCA5A5" text-anchor="middle">
    ❌ CALL TERMINATED — Workflow Broken + Authorization Gap Remains
  </text>
</svg>
