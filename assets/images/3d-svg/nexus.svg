<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="nx-t nx-d">
  <title id="nx-t">Trust Verification Nexus</title>
  <desc id="nx-d">A payer domain and a provider domain bridged by a central conformance-verification shield carrying a voice waveform: disclosure, pre-data gate, escalation, and sealed audit.</desc>
  <style>
    .card { fill:#ffffff; stroke:#e3ebf2; stroke-width:1.5; }
    .node { fill:#16385f; }
    .nodetext { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:22px; font-weight:700; fill:#e8f1fb; }
    .lab { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:20px; font-weight:700; fill:#082a5b; }
    .sub { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:15px; fill:#5d6b7a; }
  </style>

  <rect x="6" y="6" width="988" height="608" rx="18" class="card"/>

  <!-- connectors -->
  <line x1="240" y1="300" x2="430" y2="300" stroke="#188eaa" stroke-width="4" stroke-linecap="round"/>
  <line x1="570" y1="300" x2="760" y2="300" stroke="#188eaa" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="300" r="5.5" fill="#188eaa"/><circle cx="368" cy="300" r="5.5" fill="#188eaa"/>
  <circle cx="632" cy="300" r="5.5" fill="#188eaa"/><circle cx="700" cy="300" r="5.5" fill="#188eaa"/>

  <!-- payer domain -->
  <rect x="80" y="252" width="160" height="96" rx="16" class="node"/>
  <text x="160" y="307" text-anchor="middle" class="nodetext">Payer</text>

  <!-- provider domain -->
  <rect x="760" y="252" width="160" height="96" rx="16" class="node"/>
  <text x="840" y="307" text-anchor="middle" class="nodetext">Provider</text>

  <!-- central conformance shield -->
  <path d="M500 232 L566 254 C566 328 544 368 500 390 C456 368 434 328 434 254 Z"
        fill="#e8f8f4" stroke="#188eaa" stroke-width="3"/>
  <g stroke="#178a7a" stroke-width="5" stroke-linecap="round">
    <line x1="468" y1="306" x2="468" y2="318"/>
    <line x1="484" y1="296" x2="484" y2="328"/>
    <line x1="500" y1="286" x2="500" y2="338"/>
    <line x1="516" y1="296" x2="516" y2="328"/>
    <line x1="532" y1="306" x2="532" y2="318"/>
  </g>

  <text x="500" y="452" text-anchor="middle" class="lab">Conformance verification</text>
  <text x="500" y="478" text-anchor="middle" class="sub">disclosure · pre-data gate · escalation · sealed audit</text>
</svg>
