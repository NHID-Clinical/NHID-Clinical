<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" role="img" aria-labelledby="tz-t tz-d">
  <defs>
    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D9488;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67E8F9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <title id="tz-t">Five-Layer Trust Stack</title>
  <desc id="tz-d">The NHID-Clinical five-layer trust architecture in glossy 3D isometric style</desc>

  <!-- Background -->
  <rect width="1000" height="800" fill="#0B1220"/>

  <!-- Shadow/Perspective base -->
  <ellipse cx="500" cy="720" rx="300" ry="40" fill="#000000" opacity="0.15"/>

  <!-- Layer 5: OpenTelemetry (Top) -->
  <g filter="url(#shadow)">
    <path d="M 200 150 L 500 80 L 800 150 L 500 220 Z" fill="url(#grad-teal)" opacity="0.9"/>
    <path d="M 200 150 L 200 250 L 500 320 L 500 220 Z" fill="url(#grad-teal)" opacity="0.7"/>
    <path d="M 800 150 L 800 250 L 500 320 L 500 220 Z" fill="url(#grad-teal)" opacity="0.8"/>
    <!-- Glass overlay -->
    <path d="M 200 150 L 500 80 L 800 150 L 500 220 Z" fill="url(#grad-glass)" opacity="0.6"/>
    <!-- Edge highlight -->
    <path d="M 205 155 L 500 90 L 795 155" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.4"/>
    <!-- Label -->
    <text x="500" y="180" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="Inter, sans-serif">OpenTelemetry</text>
    <text x="500" y="210" text-anchor="middle" font-size="12" fill="#E0F2F1" font-family="Inter, sans-serif" opacity="0.9">Observability &amp; Metrics</text>
  </g>

  <!-- Layer 4: FHIR AuditEvent -->
  <g filter="url(#shadow)">
    <path d="M 150 280 L 500 200 L 850 280 L 500 360 Z" fill="url(#grad-cyan)" opacity="0.85"/>
    <path d="M 150 280 L 150 400 L 500 480 L 500 360 Z" fill="url(#grad-cyan)" opacity="0.65"/>
    <path d="M 850 280 L 850 400 L 500 480 L 500 360 Z" fill="url(#grad-cyan)" opacity="0.75"/>
    <path d="M 150 280 L 500 200 L 850 280 L 500 360 Z" fill="url(#grad-glass)" opacity="0.5"/>
    <path d="M 155 290 L 500 215 L 845 290" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.3"/>
    <!-- Label -->
    <text x="500" y="320" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="Inter, sans-serif">FHIR AuditEvent R4</text>
    <text x="500" y="350" text-anchor="middle" font-size="12" fill="#E0F7FA" font-family="Inter, sans-serif" opacity="0.9">Audit Logging</text>
  </g>

  <!-- Layer 3: NHID-Auth v2 -->
  <g filter="url(#shadow)">
    <path d="M 100 410 L 500 320 L 900 410 L 500 500 Z" fill="url(#grad-blue)" opacity="0.8"/>
    <path d="M 100 410 L 100 550 L 500 640 L 500 500 Z" fill="url(#grad-blue)" opacity="0.6"/>
    <path d="M 900 410 L 900 550 L 500 640 L 500 500 Z" fill="url(#grad-blue)" opacity="0.7"/>
    <path d="M 100 410 L 500 320 L 900 410 L 500 500 Z" fill="url(#grad-glass)" opacity="0.45"/>
    <path d="M 105 420 L 500 330 L 895 420" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.25"/>
    <!-- Label -->
    <text x="500" y="460" text-anchor="middle" font-size="24" font-weight="bold" fill="#FFFFFF" font-family="Inter, sans-serif">NHID-Auth v2</text>
    <text x="500" y="490" text-anchor="middle" font-size="12" fill="#BBDEFB" font-family="Inter, sans-serif" opacity="0.9">Cryptographic Authorization</text>
  </g>

  <!-- Layer 2: NHID-Clinical v1.3 (Highlighted) -->
  <g filter="url(#shadow)">
    <path d="M 50 540 L 500 440 L 950 540 L 500 640 Z" fill="url(#grad-purple)" opacity="0.9"/>
    <path d="M 50 540 L 50 700 L 500 800 L 500 640 Z" fill="url(#grad-purple)" opacity="0.7"/>
    <path d="M 950 540 L 950 700 L 500 800 L 500 640 Z" fill="url(#grad-purple)" opacity="0.8"/>
    <!-- Enhanced glass for highlight -->
    <path d="M 50 540 L 500 440 L 950 540 L 500 640 Z" fill="url(#grad-glass)" opacity="0.7"/>
    <!-- Glow ring -->
    <path d="M 50 540 L 500 440 L 950 540 L 500 640 Z" stroke="#E0B0FF" stroke-width="3" fill="none" opacity="0.4" filter="url(#glow)"/>
    <!-- Strong highlight edge -->
    <path d="M 55 550 L 500 450 L 945 550" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.5"/>
    <!-- Label -->
    <text x="500" y="590" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF" font-family="Inter, sans-serif">NHID-Clinical v1.3</text>
    <text x="500" y="625" text-anchor="middle" font-size="12" fill="#F3E5FF" font-family="Inter, sans-serif" opacity="0.95">Behavioral Disclosure Baseline</text>
  </g>

  <!-- Layer 1: STIR/SHAKEN (Bottom) -->
  <g filter="url(#shadow)">
    <path d="M 0 670 L 500 560 L 1000 670 L 500 780 Z" fill="#1E293B" opacity="0.85"/>
    <path d="M 0 670 L 0 780 L 500 800 L 500 780 Z" fill="#0F172A" opacity="0.7"/>
    <path d="M 1000 670 L 1000 780 L 500 800 L 500 780 Z" fill="#1E293B" opacity="0.75"/>
    <path d="M 0 670 L 500 560 L 1000 670 L 500 780 Z" fill="url(#grad-glass)" opacity="0.3"/>
    <path d="M 5 680 L 500 570 L 995 680" stroke="#94A3B8" stroke-width="2" fill="none" opacity="0.3"/>
    <!-- Label -->
    <text x="500" y="720" text-anchor="middle" font-size="24" font-weight="bold" fill="#E2E8F0" font-family="Inter, sans-serif">STIR/SHAKEN</text>
    <text x="500" y="750" text-anchor="middle" font-size="12" fill="#CBD5E1" font-family="Inter, sans-serif" opacity="0.8">Carrier Authentication</text>
  </g>

  <!-- Annotations and connectors -->
  <text x="50" y="750" font-size="11" fill="#64748B" font-family="Inter, sans-serif" font-style="italic">Layer 0 — the NPI gap: no cross-organization authorization for AI agents</text>

  <!-- Step numbers (right side) -->
  <circle cx="920" cy="180" r="18" fill="none" stroke="#67E8F9" stroke-width="2" opacity="0.6"/>
  <text x="920" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#67E8F9" opacity="0.8">5</text>

  <circle cx="920" cy="320" r="18" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.6"/>
  <text x="920" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#22D3EE" opacity="0.8">4</text>

  <circle cx="920" cy="460" r="18" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  <text x="920" y="468" text-anchor="middle" font-size="14" font-weight="bold" fill="#3B82F6" opacity="0.8">3</text>

  <circle cx="920" cy="590" r="18" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.8"/>
  <text x="920" y="598" text-anchor="middle" font-size="14" font-weight="bold" fill="#A78BFA">2</text>

  <circle cx="920" cy="720" r="18" fill="none" stroke="#64748B" stroke-width="2" opacity="0.6"/>
  <text x="920" y="728" text-anchor="middle" font-size="14" font-weight="bold" fill="#94A3B8" opacity="0.7">1</text>
</svg>
