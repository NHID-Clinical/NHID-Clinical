<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="tz-t tz-d">
  <title id="tz-t">Five-Layer Trust Stack</title>
  <desc id="tz-d">The NHID-Clinical five-layer trust architecture as a flat stack: OpenTelemetry observability, FHIR AuditEvent R4 audit logging, NHID-Auth v2 cryptographic authorization, NHID-Clinical v1.3 behavioral disclosure (highlighted), and STIR/SHAKEN carrier authentication, over the Layer 0 NPI gap.</desc>
  <style>
    .card { fill:#ffffff; stroke:#e3ebf2; stroke-width:1.5; }
    .band { fill:#f4f8fc; stroke:#dbe5f0; stroke-width:1.5; }
    .bandhi { fill:#e8f8f4; stroke:#8fd3c8; stroke-width:2; }
    .lbl { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:21px; font-weight:700; fill:#082a5b; }
    .lblhi { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:21px; font-weight:700; fill:#0e7568; }
    .sub { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:15px; font-weight:400; fill:#5d6b7a; }
    .num { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:19px; font-weight:700; fill:#ffffff; }
    .note { font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; font-size:15px; font-style:italic; fill:#5d6b7a; }
  </style>

  <rect x="6" y="6" width="888" height="548" rx="18" class="card"/>

  <!-- L5 -->
  <rect x="40" y="40" width="820" height="72" rx="12" class="band"/>
  <circle cx="88" cy="76" r="22" fill="#16385f"/><text x="88" y="83" text-anchor="middle" class="num">5</text>
  <text x="132" y="70" class="lbl">OpenTelemetry</text>
  <text x="132" y="94" class="sub">Enterprise observability export</text>

  <!-- L4 -->
  <rect x="40" y="128" width="820" height="72" rx="12" class="band"/>
  <circle cx="88" cy="164" r="22" fill="#16385f"/><text x="88" y="171" text-anchor="middle" class="num">4</text>
  <text x="132" y="158" class="lbl">FHIR AuditEvent R4</text>
  <text x="132" y="182" class="sub">Healthcare-native audit logging (base spec)</text>

  <!-- L3 -->
  <rect x="40" y="216" width="820" height="72" rx="12" class="band"/>
  <circle cx="88" cy="252" r="22" fill="#0b6ebc"/><text x="88" y="259" text-anchor="middle" class="num">3</text>
  <text x="132" y="246" class="lbl">NHID-Auth v2</text>
  <text x="132" y="270" class="sub">Cryptographic authorization — Ed25519 agent passports</text>

  <!-- L2 highlight -->
  <rect x="40" y="304" width="820" height="72" rx="12" class="bandhi"/>
  <circle cx="88" cy="340" r="22" fill="#188eaa"/><text x="88" y="347" text-anchor="middle" class="num">2</text>
  <text x="132" y="334" class="lblhi">NHID-Clinical v1.3</text>
  <text x="132" y="358" class="sub">Behavioral disclosure baseline — 4 controls + ATR-01</text>

  <!-- L1 -->
  <rect x="40" y="392" width="820" height="72" rx="12" class="band"/>
  <circle cx="88" cy="428" r="22" fill="#16385f"/><text x="88" y="435" text-anchor="middle" class="num">1</text>
  <text x="132" y="422" class="lbl">STIR/SHAKEN</text>
  <text x="132" y="446" class="sub">Carrier number authentication (RFC 8224)</text>

  <text x="40" y="508" class="note">Layer 0 — the NPI gap: no cross-organization authorization for AI agents.</text>
</svg>
