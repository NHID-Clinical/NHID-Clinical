<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="ls-t ls-d">
  <title id="ls-t">Impersonation latency: without a standard vs a verified trust pathway</title>
  <desc id="ls-d">A glossy 3D contrast. Left: an unverified AI call reaches PHI with no verification pathway — disclosure only after data has moved, no audit trail. Right: the NHID-Clinical verified pathway — early disclosure gate, pre-data-exchange checkpoint, human escalation, sealed audit.</desc>
  <defs>
    <linearGradient id="grad-danger-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-danger-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#991B1B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7F1D1D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-success-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-success-side" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#065F46;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#064E3B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </linearGradient>
    <filter id="shadow-danger">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#991B1B" flood-opacity="0.35"/>
    </filter>
    <filter id="shadow-success">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#065F46" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-success">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" fill="#0B1220"/>

  <!-- LEFT: without a standard - 3D isometric card -->
  <g filter="url(#shadow-danger)">
    <!-- Card top face -->
    <path d="M 60 100 L 440 70 L 490 110 L 110 140 Z" fill="url(#grad-danger-top)" opacity="0.85"/>
    <!-- Card left face -->
    <path d="M 60 100 L 110 140 L 110 310 L 60 270 Z" fill="url(#grad-danger-side)" opacity="0.7"/>
    <!-- Card right face -->
    <path d="M 440 70 L 490 110 L 490 280 L 440 240 Z" fill="url(#grad-danger-side)" opacity="0.75"/>
    <!-- Glass overlay -->
    <path d="M 60 100 L 440 70 L 490 110 L 110 140 Z" fill="url(#grad-glass)" opacity="0.5"/>
    <!-- Top edge highlight -->
    <path d="M 65 105 L 435 78 L 485 115" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <text x="250" y="85" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Inter, sans-serif">Without a standard</text>

  <!-- Progress bar and nodes -->
  <line x1="68" y1="160" x2="428" y2="160" stroke="#7F1D1D" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <line x1="68" y1="160" x2="408" y2="160" stroke="#EF4444" stroke-width="5" stroke-linecap="round"/>

  <!-- Step circles -->
  <g>
    <circle cx="128" cy="160" r="16" fill="#EF4444" filter="url(#shadow-danger)"/>
    <text x="128" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">PHI</text>
    <text x="128" y="195" text-anchor="middle" font-size="11" fill="#CBD5E1">member ID, DOB</text>
    <text x="128" y="210" text-anchor="middle" font-size="11" fill="#CBD5E1">requested</text>
  </g>

  <g>
    <circle cx="308" cy="160" r="16" fill="#EF4444" filter="url(#shadow-danger)"/>
    <text x="308" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">!</text>
    <text x="308" y="195" text-anchor="middle" font-size="11" fill="#CBD5E1">data exchanged,</text>
    <text x="308" y="210" text-anchor="middle" font-size="11" fill="#CBD5E1">unverified</text>
  </g>

  <g>
    <circle cx="418" cy="160" r="16" fill="#7F1D1D" opacity="0.8"/>
    <text x="418" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#E2E8F0">↓</text>
    <text x="418" y="195" text-anchor="middle" font-size="11" fill="#CBD5E1">disclosure</text>
    <text x="418" y="210" text-anchor="middle" font-size="11" fill="#CBD5E1">(too late)</text>
  </g>

  <!-- Info box -->
  <rect x="60" y="240" width="380" height="75" rx="12" fill="#7F1D1D" opacity="0.2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="80" y="272" font-size="15" font-weight="700" fill="#FCA5A5">Impersonation latency ≈ unbounded</text>
  <text x="80" y="295" font-size="13" fill="#E2E8F0">No disclosure gate · no audit trail · PHI at risk.</text>

  <!-- RIGHT: with NHID-Clinical v1.3 - 3D isometric card -->
  <g filter="url(#shadow-success)">
   <g filter="url(#glow-success)">
    <!-- Card top face -->
    <path d="M 560 100 L 940 70 L 990 110 L 610 140 Z" fill="url(#grad-success-top)" opacity="0.9"/>
    <!-- Card left face -->
    <path d="M 560 100 L 610 140 L 610 310 L 560 270 Z" fill="url(#grad-success-side)" opacity="0.75"/>
    <!-- Card right face -->
    <path d="M 940 70 L 990 110 L 990 280 L 940 240 Z" fill="url(#grad-success-side)" opacity="0.8"/>
    <!-- Glass overlay - enhanced for success state -->
    <path d="M 560 100 L 940 70 L 990 110 L 610 140 Z" fill="url(#grad-glass)" opacity="0.6"/>
    <!-- Top edge highlight - stronger for success -->
    <path d="M 565 105 L 935 78 L 985 115" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.5"/>
   </g>
  </g>

  <text x="750" y="85" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF" font-family="Inter, sans-serif">With NHID-Clinical v1.3</text>

  <!-- Progress bar and nodes -->
  <line x1="568" y1="160" x2="928" y2="160" stroke="#065F46" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <line x1="568" y1="160" x2="628" y2="160" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>

  <!-- Step circles -->
  <g>
    <circle cx="608" cy="160" r="16" fill="#10B981" filter="url(#shadow-success)"/>
    <text x="608" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">ID</text>
    <text x="608" y="195" text-anchor="middle" font-size="11" fill="#CBD5E1">disclosure</text>
    <text x="608" y="210" text-anchor="middle" font-size="11" fill="#CBD5E1">(IDG-01)</text>
  </g>

  <g>
    <circle cx="728" cy="160" r="16" fill="#065F46" opacity="0.85"/>
    <text x="728" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#6EE7B7">✓</text>
    <text x="728" y="195" text-anchor="middle" font-size="11" fill="#CBD5E1">gate cleared</text>
    <text x="728" y="210" text-anchor="middle" font-size="11" fill="#CBD5E1">(PDX-01)</text>
  </g>

  <g>
    <circle cx="828" cy="160" r="16" fill="#065F46" opacity="0.85"/>
    <text x="828" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#6EE7B7">PHI</text>
    <text x="828" y="195" text-anchor="middle" font-size="11" fill="#CBD5E1">exchange</text>
    <text x="828" y="210" text-anchor="middle" font-size="11" fill="#CBD5E1">after verify</text>
  </g>

  <g>
    <circle cx="928" cy="160" r="16" fill="#10B981" filter="url(#shadow-success)"/>
    <text x="928" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">⇲</text>
    <text x="928" y="195" text-anchor="middle" font-size="11" fill="#CBD5E1">escalation +</text>
    <text x="928" y="210" text-anchor="middle" font-size="11" fill="#CBD5E1">audit (EIT/ATR)</text>
  </g>

  <!-- Info box -->
  <rect x="560" y="240" width="380" height="75" rx="12" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
  <text x="580" y="272" font-size="15" font-weight="700" fill="#6EE7B7">Impersonation latency measured &amp; bounded</text>
  <text x="580" y="295" font-size="13" fill="#E2E8F0">Early disclosure · checkpoint · escalation · sealed audit.</text>
</svg>
