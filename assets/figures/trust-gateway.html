<style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
</style><style>
.tg-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 0}
.tg-chip{appearance:none;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;row-gap:2px;align-items:center;text-align:left;
  padding:8px 10px;border-radius:6px;border:1px solid var(--anatomy-faint);background:var(--anatomy-paper);color:var(--anatomy-text);
  font:11px/1.25 var(--anatomy-mono);cursor:pointer;transition:border-color .18s,background .18s}
.tg-chip b{grid-row:1/3;font-weight:500;font-size:14px;color:var(--anatomy-muted);width:14px}
.tg-chip span{color:var(--anatomy-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-chip code{font:9.5px/1.2 var(--anatomy-mono);letter-spacing:.04em;color:var(--anatomy-muted)}
.tg-chip:hover{border-color:var(--anatomy-mid)}
.tg-chip.is-on{border-color:var(--anatomy-hi);background:var(--anatomy-face)}
.tg-chip.is-on b{color:var(--anatomy-hi)}
.tg-chip:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:3px}
[data-readout]{white-space:normal;max-width:62%;text-align:right;line-height:1.3}
@media (max-width:640px){ .tg-chips{grid-template-columns:repeat(2,minmax(0,1fr))} .tg-chip span{white-space:normal} .iso-plate-corner[data-corner="hint"]{display:none} [data-readout]{font-size:10.5px;max-width:100%} }

.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;

const P = {"origin":[445.8616918798653,236.73334643997913],"scale":1.504055952087066,"azimuth":48,"elevation":32};
const SX = [-120,-60,0,60,120], IDS = ["IDG-01","PDX-01","DBC-01","EIT-01","ATR-01"], ASKS = ["Did it say it is automated?","PHI only after disclosure?","Any claim to be human?","Was a human honoured?","Audit fields complete?"];
const SECTORS = ["DISCLOSE","DENY","LOG","ESCALATE","CONTINUE"], ACTIONS = ["DISCLOSE_IDENTITY","DENY_DATA","LOG_ONLY","ESCALATE_HUMAN","CONTINUE_AI"];
const DIAL = [208,-70], DIAL_R = 19, DIAL_TOP = 57;
const ENTRY_X = -168, DIV_X = 156, CART_Z = 4, CART_TOP = 17;
const GATE_CLOSED_Z = 4, GATE_OPEN_Z = 38;
const BAY_Y = -76, BIN_Y = 75, BIN_FLOOR = -10;
const PAYER_X = 202;
const PRN = {"x":96,"y":-62,"w":26,"d":18,"r":2}, PAPER_W = 14, PAPER_MAX = 24;

// Four truthful scenarios the engine actually distinguishes.
// pass[] = per-control pass/fail for IDG, PDX, DBC, EIT, ATR; sector = the composite action.
const SCEN = [
  { t:"Clean, disclosed call",                pass:[1,1,1,1,1], sector:4, code:"all controls pass",                   exit:"continue", disclosed:1 },
  { t:"PHI requested before disclosure",       pass:[0,0,1,1,1], sector:1, code:"PDX01_PHI_GATE_TRIGGERED",            exit:"deny",     disclosed:0 },
  { t:"Agent implies it is human",             pass:[1,1,0,1,1], sector:2, code:"DBC01_IMPERSONATION_PHRASE_DETECTED", exit:"continue", disclosed:1 },
  { t:"Caller asks for a human, not honoured", pass:[1,1,1,0,1], sector:3, code:"EIT01_ESCALATION_NOT_HONORED",        exit:"escalate", disclosed:1 },
];

const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const cart = svg.querySelector('[data-part="cartridge"]');
const platform = svg.querySelector('[data-part="platform"]');
const gate = svg.querySelector('[data-part="gate"]');
const needle = svg.querySelector('[data-part="needle"]');
const led = svg.querySelector('[data-led]');
const bell = svg.querySelector('[data-bell]');
const flag = svg.querySelector('[data-flag]');
const paper = svg.querySelector('[data-paper]');
const display = svg.querySelector('[data-display]');
const lamps = SX.map((_, i) => svg.querySelector('[data-lamp="'+i+'"]'));
const pools = SX.map((_, i) => svg.querySelector('[data-pool="'+i+'"]'));
const readout = document.querySelector("[data-readout]");
const chips = Array.from(document.querySelectorAll("[data-chip]"));
const still = matchMedia("(prefers-reduced-motion: reduce)");
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t < .5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
const needleAt = function needleAt(idx) {
  const [x, y] = DIAL;
  const a = -Math.PI * 0.72 + (idx / (SECTORS.length - 1)) * Math.PI * 1.44;
  return lineOnTop([x - Math.sin(a) * 1.8, y + Math.cos(a) * 1.8], [x + Math.sin(a) * (DIAL_R - 4), y - Math.cos(a) * (DIAL_R - 4)], DIAL_TOP + 0.3, P);
};
const PASS = "#2bb3a3", FAIL = "#e0953f";
const SECTOR_COLOR = [FAIL, FAIL, "#8aa0b6", FAIL, PASS];

let s = 0, clock = 0, visible = false, frame = 0, last = 0, auto = true, quietUntil = 0;
let paperLen = -1;

function glow(el, color){ el.style.fill = color||""; el.style.filter = color ? "drop-shadow(0 0 3px "+color+")" : ""; }
function setLamp(i, state){ // -1 off, 0 fail, 1 pass
  const g = lamps[i]; if(!g) return;
  const c = state===1 ? PASS : state===0 ? FAIL : "";
  g.querySelectorAll('.lamp').forEach(el=>glow(el, c));
  const pool = pools[i]; if (pool){ pool.style.fill = c; pool.style.opacity = c ? ".14" : "0"; pool.style.filter = c ? "blur(3px)" : ""; }
}
function resetLamps(){ SX.forEach((_,i)=>setLamp(i,-1)); }
function setPaper(len){
  const q = Math.round(len*2)/2; if (q === paperLen) return; paperLen = q;
  if (q <= 0.5){ paper.innerHTML = ""; return; }
  const strip = { x: PRN.x + 6, y: PRN.y - q, w: PAPER_W, d: q, r: 0.6 };
  let html = solidSvg(slabOf(strip, 0.2, 0.5, P, 2), { tone: "hi", crease: "none" });
  // printed lines: rule lines that stand for the trace text, one per 4 units
  const rules = [];
  for (let y = strip.y + 3; y < strip.y + q - 2; y += 4) {
    const w = (y - strip.y) % 8 < 4 ? 9 : 6.5;
    rules.push(lineOnTop([strip.x + 2, y], [strip.x + 2 + w, y], 0.72, P));
  }
  if (rules.length) html += lineSvg(rules.join(""), { tone: "lo", free: true });
  paper.innerHTML = html;
}
function setFlag(up){ flag.setAttribute("transform", translateAlong(P, [0, 0, up ? 4.5 : 0])); }
function setDisplay(txt){ if (display.textContent !== txt) display.textContent = txt; }

function place(x, y, z, platY){
  cart.setAttribute("transform", translateAlong(P, [x, y, z]));
  platform.setAttribute("transform", translateAlong(P, [0, platY, 0]));
}

// Timeline of one scenario, p in [0,1]: enter → 5 stations → to the diverter → decide → exit
const SEGS = 5 + 3;
function render(sc, p){
  const n = SX.length;
  const seg = p * SEGS;
  let x = ENTRY_X, y = 0, z = CART_Z, platY = 0, gz = GATE_CLOSED_Z, sector = 4, ledC = "", bellC = "";
  let flagUp = 0, paperLen = 0, phase = "";
  resetLamps();
  const lit = Math.min(n, Math.floor(seg));
  for (let i=0;i<lit;i++) setLamp(i, sc.pass[i]);
  if (lit >= 1 && sc.disclosed) flagUp = 1;
  if (lit >= 5) paperLen = PAPER_MAX;
  if (seg < n) {                                   // travelling station to station
    const i = Math.floor(seg), f = seg - i;
    const from = i===0 ? ENTRY_X : SX[i-1];
    x = lerp(from, SX[i], ease(clamp(f/0.55,0,1)));  // move, then dwell
    if (f>0.5) setLamp(i, sc.pass[i]);
    if (i===0 && f>0.6 && sc.disclosed) flagUp = 1;
    if (i===4 && f>0.5) paperLen = PAPER_MAX * ease(clamp((f-0.5)/0.5,0,1));
    phase = (f>0.5 ? "station "+(i+1)+"/5 · "+IDS[i]+" · "+(sc.pass[i]?"pass":"FAIL") : "→ station "+(i+1)+"/5 · "+IDS[i]);
  } else if (seg < n+1) {                          // to the diverter
    const f = seg - n;
    x = lerp(SX[n-1], DIV_X, ease(f));
    for (let i=0;i<n;i++) setLamp(i, sc.pass[i]);
    phase = "all five evaluated · to the decision";
  } else if (seg < n+2) {                          // decide: needle, LED, display
    const f = seg - (n+1);
    x = DIV_X;
    for (let i=0;i<n;i++) setLamp(i, sc.pass[i]);
    sector = Math.round(lerp(4, sc.sector, ease(f)));
    ledC = f>0.55 ? SECTOR_COLOR[sc.sector] : "";
    if (f>0.55) setDisplay(ACTIONS[sc.sector]); else setDisplay("…");
    if (sc.exit==="continue") gz = lerp(GATE_CLOSED_Z, GATE_OPEN_Z, ease(clamp((f-0.4)/0.6,0,1)));
    phase = "decision · " + ACTIONS[sc.sector];
  } else {                                         // exit by the chosen route
    const f = clamp(seg - (n+2), 0, 1);
    for (let i=0;i<n;i++) setLamp(i, sc.pass[i]);
    sector = sc.sector; ledC = SECTOR_COLOR[sc.sector]; setDisplay(ACTIONS[sc.sector]);
    if (sc.exit==="continue"){ gz = GATE_OPEN_Z; x = lerp(DIV_X, PAYER_X, ease(f)); phase = "continues to the payer desk"; }
    else if (sc.exit==="escalate"){ x = DIV_X; y = lerp(0, BAY_Y, ease(f)); platY = y; bellC = f>0.8 ? FAIL : ""; phase = "handed to a human"; }
    else { x = DIV_X; y = lerp(0, BIN_Y, ease(clamp(f/0.7,0,1))); platY = y; z = f>0.7 ? lerp(CART_Z, BIN_FLOOR+2, ease((f-0.7)/0.3)) : CART_Z; phase = "diverted to DENY"; }
  }
  if (seg < n+1) setDisplay(ACTIONS[4]);
  place(x, y, z, platY);
  gate.setAttribute("transform", translateAlong(P, [0, 0, gz]));
  needle.setAttribute("d", needleAt(sector));
  led.querySelectorAll('.led').forEach(el=>glow(el, ledC));
  bell.querySelectorAll('.lamp').forEach(el=>glow(el, bellC));
  setFlag(flagUp); setPaper(paperLen);
  updateText(sc, phase);
}
function updateText(sc, phase){
  const txt = sc.t + " · " + phase + (sc.code && /decision|continues|handed|diverted/.test(phase) ? " · " + sc.code : "");
  if (readout.textContent !== txt) readout.textContent = txt;
  chips.forEach((c, i) => { const on = i === s; c.setAttribute("aria-selected", on ? "true" : "false"); c.classList.toggle("is-on", on); });
}
function describe(){ const sc = SCEN[s]; stage.setAttribute("aria-valuetext", (s+1)+" of "+SCEN.length+": "+sc.t+" — "+ACTIONS[sc.sector]+(sc.code? ", "+sc.code:"")); }

const SPAN = SEGS * 0.78 + 1.2;   // seconds per scenario, including the hold at the end
function tick(now){
  const dt = last ? Math.min((now-last)/1000, 1/30) : 1/60; last = now;
  if (!still.matches) clock += dt;
  let p = clock / SPAN;
  if (p >= 1){ if (performance.now() < quietUntil) { clock = SPAN - 0.001; p = 0.999; } else { clock = 0; p = 0; s = (s+1) % SCEN.length; describe(); } }
  render(SCEN[s], clamp(p,0,1));
  frame = visible ? requestAnimationFrame(tick) : 0;
}
const frozen = /#s\d@[0-9.]+/.test(location.hash);
const hm = location.hash.match(/#s(\d)@([0-9.]+)/);
const run = () => { if(!frozen && auto && !frame && visible){ last = 0; frame = requestAnimationFrame(tick); } };
window.__render = (si, p) => { auto = false; if (frame){ cancelAnimationFrame(frame); frame = 0; } s = ((si % SCEN.length) + SCEN.length) % SCEN.length; render(SCEN[s], Math.max(0, Math.min(1, p))); };
window.__scenes = SCEN.length;
new IntersectionObserver((e)=>{ visible = e[e.length-1].isIntersecting; if(visible) run(); }, { rootMargin:"120px 0px" }).observe(stage);
function select(i){ s = ((i % SCEN.length) + SCEN.length) % SCEN.length; clock = 0; quietUntil = performance.now() + 3600; describe(); if (still.matches) render(SCEN[s], 1); }
chips.forEach((c, i) => c.addEventListener("click", (e) => { e.stopPropagation(); select(i); }));
stage.addEventListener("pointerdown", ()=> select(s+1));
stage.addEventListener("keydown",(e)=>{ if(e.key==="ArrowRight"||e.key===" "){e.preventDefault(); select(s+1);} if(e.key==="ArrowLeft"){e.preventDefault(); select(s-1);} });
describe();
if (frozen){ s = (+hm[1]) % SCEN.length; render(SCEN[s], Math.min(1, +hm[2])); }
else if (still.matches){ render(SCEN[1], 1); }
else render(SCEN[0], 0);
</script>
