name: CI

on:
  push:
    branches: ["main", "claude/*", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  unit-invariant:
    name: "Unit invariant: 2065 passed, 0 skipped, 0 xfailed"
    runs-on: ubuntu-latest

    steps:
      # Full history, not the default shallow clone. The control-set guard's
      # regression proof compares its committed fixture against
      # ba93e21:specification.html, and on a shallow checkout that comparison
      # cannot run. It used to skip there while passing locally, which is how
      # this job reported "1144 passed, 1 skipped" under a name promising zero.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # validate_ci.py runs the suite itself, so the API has to be up around
      # it -- otherwise it measures 987 passed / 18 skipped while this job's
      # own name advertises 1148, which is the mislabelling this change exists
      # to remove. NHID_REQUIRE_SERVER=1 turns a dead server into an error.
      - name: Validate test invariants against a live API
        env:
          NHID_REQUIRE_SERVER: "1"
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 \
            > /tmp/nhid-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/openapi.json; then
              echo "API ready after ${i}s"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::API process exited during startup"
              cat /tmp/nhid-server.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -sf -o /dev/null http://127.0.0.1:8000/openapi.json; then
            echo "::error::API did not become ready within 30s"
            cat /tmp/nhid-server.log
            exit 1
          fi

          python scripts/validate_ci.py

      # Runs on every PR, not only nightly: the published corpus figures went
      # stale for a month while nightly-only checks reported green.
      - name: Published-number drift guard
        run: python scripts/check_number_drift.py

      - name: Control-set completeness guard
        run: python scripts/check_control_set.py

      # check_baseline.py pins DETECTION RATES; nothing checked the corpora's
      # own structure, so a README claiming "~2,200 turns" for a 4,838-row
      # file, three stale declared-count columns, and a join key that resolves
      # to a different column than its name suggests all sat in committed data
      # while CI reported green.
      - name: Fixture self-consistency guard
        run: python scripts/check_fixture_integrity.py

      # Tier 0 is deliberately offline: prevent accidental phone-home code.
      # This ran scripts/check_pilot_offline.py, which inspected only
      # docs/pilot-kit/measure_pilot.py. That file is now a shim over
      # src/pilot_measure.py, so the step would have kept passing while
      # guarding almost nothing. check_offline_kit.py covers the kit's whole
      # import closure and is a strict superset of the retired guard's module
      # and call lists; the retired script is deleted rather than left beside
      # it, because two guards for one promise can disagree and one passing
      # masks the other.
      - name: Tier 0 pilot kit remains offline
        run: python scripts/check_offline_kit.py

      # The Trust Gateway renders real engine output. Without this the claim
      # would only be true of the day the fixture was generated.
      - name: Trust Gateway matches the engine
        run: python scripts/build_gateway_fixture.py --check

      # The Front-Desk Walkthrough plays back recorded engine output. This is
      # what stops the scene quietly becoming an illustration again.
      - name: Front-Desk Walkthrough matches the engine
        run: python scripts/build_walkthrough_fixture.py --check

      # Three figures computed by replaying committed corpora through the
      # engine. Without this they would be true only on the day they were made.
      - name: Evidence figures match the engine
        run: python scripts/build_evidence_visuals.py --check

      # Nine pages carrying a generated arc cannot be kept in order by hand.
      - name: Journey wayfinder is current
        run: python scripts/add_journey_wayfinder.py --check

      # Header, drawer and footer are one generated block on twelve pages. The
      # footer had drifted into six variants before this existed.
      - name: Shared header, drawer and footer are current
        run: python scripts/ia/build_site_chrome.py --check

      # The Developers page shows one hosted-API request and its answer. The
      # answer is recorded from the handler, never typed, and must still match.
      - name: Developers page API sample is the handler's answer
        run: python scripts/build_api_sample.py --check

      # The specification reading aid (/spec) has its own eval under eval/,
      # kept outside tests/ so the published unit-test count describes the
      # engine alone. Until 2026-10-25 nothing ran it: a denial sentence
      # entering docs/ made the aid answer "what is the HIPAA certification
      # number?" for four merges before anyone looked. The baseline is the
      # local backend's numbers; a drop in hits or refusals, or any unsupported
      # answer, fails the job.
      - name: Specification reading aid holds its baseline
        run: |
          python -m src.nhid_spec_rag
          python -m pytest eval/ -q -p no:cacheprovider
          python eval/run_spec_rag_eval.py --quiet --check eval/baseline-local.json

  # The suite had only ever executed on Ubuntu / Python 3.11. The first run on
  # Windows / Python 3.14 (a contributor's laptop, 2026-10-25) failed 21 tests:
  # SQLite handles not closed on error paths, CRLF checkouts breaking byte
  # compares, reads without an encoding, a backslash in a recorded path, and a
  # JSON depth guard that relied on CPython raising RecursionError -- which 3.14
  # no longer does at that depth, so a fail-closed control had silently opened.
  # None of it was a control defect, and none of it was visible to CI. This job
  # runs the suite where it broke. It asserts pass/fail only; the published
  # count stays keyed to the 3.11 leg above.
  portability:
    name: "Portability: ${{ matrix.os }} / Python ${{ matrix.python }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # bash on both runners (Git Bash on Windows), so the server lifecycle is
      # one script rather than two.
      - name: Unit suite against a live API
        shell: bash
        env:
          NHID_REQUIRE_SERVER: "1"
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 \
            > nhid-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/openapi.json; then
              echo "API ready after ${i}s"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::API process exited during startup"
              cat nhid-server.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -sf -o /dev/null http://127.0.0.1:8000/openapi.json; then
            echo "::error::API did not become ready within 45s"
            cat nhid-server.log
            exit 1
          fi

          python -m pytest tests/ -q -p no:cacheprovider
