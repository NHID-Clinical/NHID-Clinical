name: CI

on:
  push:
    branches: ["main", "claude/*", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  unit-invariant:
    name: "Unit invariant: 1006 total (987 passed + 18 skipped)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate test invariants
        run: python scripts/validate_ci.py

      # Runs on every PR, not only nightly: the published corpus figures went
      # stale for a month while nightly-only checks reported green.
      - name: Published-number drift guard
        run: python scripts/check_number_drift.py
