name: Nightly Verify

# Zero-touch self-verification: catches engine/lexicon drift, published-number
# drift, and a dead live demo without anyone watching. Additive to ci.yml —
# never rename or duplicate the "Unit invariant" job there.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  invariants:
    name: "Test + baseline + drift invariants"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Same reason as ci.yml: validate_ci.py runs the suite, and without a
      # live API it measures the pre-2026-09-03 shape (987 passed / 18 skipped)
      # instead of the published one.
      - name: Test-count invariant (via validate_ci.py, live API)
        env:
          NHID_REQUIRE_SERVER: "1"
        run: |
          python -m uvicorn app:app --host 127.0.0.1 --port 8000 \
            > /tmp/nhid-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8000/openapi.json; then
              echo "API ready after ${i}s"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::API process exited during startup"
              cat /tmp/nhid-server.log
              exit 1
            fi
            sleep 1
          done

          if ! curl -sf -o /dev/null http://127.0.0.1:8000/openapi.json; then
            echo "::error::API did not become ready within 30s"
            cat /tmp/nhid-server.log
            exit 1
          fi

          python scripts/validate_ci.py

      - name: Confusion-matrix baseline guard
        run: python scripts/check_baseline.py

      - name: Published-number drift guard
        run: python scripts/check_number_drift.py

      - name: Control-set completeness guard
        run: python scripts/check_control_set.py

  live-demo-smoke:
    name: "Live API smoke (no-auth routes only)"
    runs-on: ubuntu-latest
    env:
      NHID_API_BASE: https://gfvq4swdtf.execute-api.us-east-1.amazonaws.com/prod
    steps:
      - uses: actions/checkout@v4

      - name: Health endpoint
        run: |
          curl -sS --fail-with-body --max-time 20 "$NHID_API_BASE/health"

      - name: VAPI adapter conformance check
        run: |
          curl -sS --fail-with-body --max-time 30 -X POST \
            "$NHID_API_BASE/v1/adapters/vapi/check" \
            -H "Content-Type: application/json" \
            -d @tests/demo_scenarios/vapi_noncompliant.json \
            | python -c "import json,sys; d=json.load(sys.stdin); assert 'violations' in d, d; print('adapter ok:', d.get('reason_code'))"

      - name: Public vendor badge SVG
        run: |
          out=$(curl -sS --fail-with-body --max-time 20 "$NHID_API_BASE/v1/public/vendor/demo-vendor/badge")
          echo "$out" | grep -q "<svg" || { echo "badge endpoint did not return SVG"; echo "$out"; exit 1; }

  report-failure:
    name: "Open issue on failure"
    runs-on: ubuntu-latest
    needs: [invariants, live-demo-smoke]
    if: failure()
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly verify failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              "The nightly self-verification workflow failed.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Check which job failed:",
              "- **invariants** — test count, confusion-matrix baseline, or published-number drift",
              "- **live-demo-smoke** — the public Lambda demo API is unhealthy",
              "",
              "Triage per the debugging playbook before changing anything.",
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "nightly-verify",
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["nightly-verify"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
            }
